name: Build Self-Compiled AirSync

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile AirSync Self Compiled
        run: |
          xcodebuild -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build" \
            build

      - name: Zip Built Application
        run: |
          cd build
          zip -r AirSync-SelfCompiled.zip AirSync.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-SelfCompiled
          path: build/AirSync-SelfCompiled.zip
